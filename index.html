<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <script>
      // Roda ANTES do React montar, senão a página pisca no tema errado
      // por uma fração de segundo (flash of incorrect theme) até o
      // ThemeContext.jsx rodar seu próprio efeito. Mesma chave de
      // localStorage que o ThemeContext usa ('theme': 'light'|'dark'|'system').
      (function () {
        var stored = localStorage.getItem('theme');
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
